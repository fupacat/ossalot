# Dev environment on Docker Desktop (ADR-036). CI's deploy-dev job runs
# `docker compose pull && docker compose up -d` here; see deploy/dev/README.md.
name: ossalot-dev

services:
  ossalot:
    image: ghcr.io/fupacat/ossalot:${OSSALOT_TAG:-main}
    restart: unless-stopped
    # Each service gets only its own secret; compose reads both from .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
    volumes:
      - ossalot-data:/data

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - ossalot

volumes:
  ossalot-data:
