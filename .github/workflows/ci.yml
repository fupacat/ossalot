# TRACEABILITY_MAPPING: REQ-032
name: CI & Test Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate MCSWE Evidence & Build Test Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MCSWE Test Evidence Suite
        run: |
          python3 scripts/run_evidence.py test

      - name: Verify 100% Test Coverage Evidence
        env:
          # Lets Go fetch the private fupacat/bcov module. The token stays in this step's environment only.
          GOPRIVATE: github.com/fupacat/bcov
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.BCOV_TOKEN }}@github.com/fupacat/bcov.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/fupacat/bcov"
        run: |
          python3 scripts/run_evidence.py coverage

      - name: Build OSSAlot Test Executable
        run: |
          go build -v -ldflags="-s -w" -o dist/ossalot ./cmd/ossalot
          ./dist/ossalot -check

      - name: Upload Test Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ossalot-test-binary
          path: dist/ossalot
          retention-days: 7

      - name: Upload Test and Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: mcswe-evidence-reports
          path: |
            reports/junit.xml
            reports/lcov.info
          retention-days: 14
